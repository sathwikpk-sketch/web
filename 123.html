<!DOCTYPE html>
<html lang="en">
<head>
  <title>Product Preview Card</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
    }

    body {
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      background: #f5f8f8;
    }

    .card {
      display: flex;
      max-width: 600px;
      background: white;
      border-radius: 10px;
      overflow: hidden; /    }

    .product-img {
      width: 50%;
      object-fit: cover;
    }

    .card-content {
      padding: 25px;
      display: flex;
      flex-direction: column;
      justify-content: center;
    }

    .category {
      letter-spacing: 3px;
      font-size: 0.8rem;
      color: gray;
      text-transform: uppercase;
      margin-bottom: 10px;
    }

    .card-content h2 {
      margin-bottom: 10px;
      font-size: 1.4rem;
      font-weight: bold;
    }

    .card-content p {
      color: #555;
      font-size: 0.9rem;
      margin-bottom: 15px;
      line-height: 1.4;
    }

    .price {
      color: #147a3e;
      font-size: 1.3rem;
      font-weight: bold;
      margin-bottom: 20px;
    }

    .btn {
      background: #147a3e;
      color: white;
      border: none;
      padding: 10px 20px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 0.95rem;
      transition: background 0.3s;
    }

    .btn:hover {
      background: #0f5d2f;
    }

    @media (max-width: 600px) {
      .card {
        flex-direction: column;
        max-width: 300px;
      }

      .product-img {
        width: 100%;
      }
    }
  </style>
</head> 

<body>

  <div class="card">
    <img src="https://www.skinn.in/dw/image/v2/BKMH_PRD/on/demandware.static/-/Sites-Skinn-product-catalog/default/dw15bb8418/images/Skinn/hi-res/NCFM14PH1_8.jpg?sw=640" alt="Perfume Bottle" class="product-img">

    <div class="card-content">
      <span class="category">Perfume</span>
      <h2>Elegant Perfume</h2>
      <p>A refreshing floral fragrance perfect for everyday wear. Feel fresh all day!</p>
      <span class="price">$59.99</span>
      <button class="btn">🛒 Add to Cart</button>
    </div>
  </div>

</body>
</html>
